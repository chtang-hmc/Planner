<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planner — Tasks, narrow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Instrument+Serif&display=swap">
<style>
body{margin:0;background:#FAF8F4}
a{color:#A8431C;text-decoration:none}
a:hover{color:#7E3114}
button{font:inherit}
input{font:inherit}
body { display: flex; justify-content: center; padding: 24px 0; }
</style>
</head>
<body>
<div style="width: 390px; height: 840px; box-sizing: border-box; background: #FAF8F4; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1A1815; display: flex; flex-direction: column;">

  <div style="flex-grow: 1; box-sizing: border-box; padding: 16px 14px 0 14px; display: flex; flex-direction: column; gap: 10px; min-height: 0;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
      <h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; line-height: 1.1;">Tasks</h1>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="display: flex; align-items: center; height: 34px; padding: 3px; box-sizing: border-box; background: #F0EDE6; border-radius: 8px; gap: 2px;">
          <span style="height: 28px; padding: 0 11px; border-radius: 6px; background: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center;">List</span>
          <a href="narrow-upcoming.html" style="height: 28px; padding: 0 11px; border-radius: 6px; font-size: 12px; color: #6E6960; display: flex; align-items: center;">Upcoming</a>
        </div>
        <button type="button" aria-label="Add task" style="width: 34px; height: 34px; border: 0; border-radius: 8px; background: #A8431C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3 L8 13 M3 8 L13 8"></path></svg>
        </button>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 11px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E4DFD5; border-radius: 8px;">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#8A8478" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5 L14 14"></path></svg>
      <label for="qn" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Filter tasks</label>
      <input id="qn" type="text" placeholder="Filter tasks…" style="flex-grow: 1; border: 0; outline: none; background: transparent; font-size: 12.5px; min-width: 0;">
    </div>

    <div style="display: flex; gap: 7px; align-items: center;">
      <button type="button" style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border: 1px solid #E4DFD5; border-radius: 16px; background: #FFFFFF; font-size: 12px; color: #33302B; cursor: pointer; flex-shrink: 0;">
        <span>By date</span>
        <svg width="9" height="9" viewBox="0 0 12 12" fill="none" stroke="#8A8478" stroke-width="1.5" aria-hidden="true"><path d="M3 4.5 L6 8 L9 4.5"></path></svg>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 11px; border: 1px solid #C9C0AE; border-radius: 16px; background: #F7EEE9; font-size: 12px; color: #8A3A16; font-weight: 500; cursor: pointer; flex-shrink: 0;">
        <span style="display: flex; align-items: flex-end; gap: 2px;">
          <span style="width: 3px; height: 6px; border-radius: 1px; background: #A8431C;"></span>
          <span style="width: 3px; height: 9px; border-radius: 1px; background: #A8431C;"></span>
          <span style="width: 3px; height: 12px; border-radius: 1px; background: #A8431C;"></span>
        </span>
        <span>Fits my energy</span>
      </button>
      <button type="button" style="height: 32px; padding: 0 11px; border: 1px solid #E4DFD5; border-radius: 16px; background: #FFFFFF; font-size: 12px; color: #6E6960; cursor: pointer; flex-shrink: 0;">All projects</button>
      <span style="font-size: 11px; color: #A9A296; flex-shrink: 0;">›</span>
    </div>

    <div style="box-sizing: border-box; background: #FFFFFF; border: 1px solid #E4DFD5; border-radius: 12px; padding: 0 14px 6px 14px;">

      <div style="padding: 12px 0 8px 0; display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; align-items: baseline; gap: 9px;">
          <span style="font-size: 12px; font-weight: 700; color: #A32B21;">Overdue</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #8A8478;">1 · 1h 00m</span>
          <span style="flex-grow: 1;"></span>
          <button type="button" style="border: 0; background: transparent; padding: 0; font-size: 11px; color: #A8431C; font-weight: 600; cursor: pointer;">Triage</button>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; height: 56px; border-top: 1px solid #F0EBE1;">
        <input type="checkbox" id="n0" style="width: 15px; height: 15px; accent-color: #A8431C; margin: 0; flex-shrink: 0;">
        <span style="width: 7px; height: 7px; border-radius: 4px; background: #B25A12; flex-shrink: 0;"></span>
        <label for="n0" style="flex-grow: 1; min-width: 0; cursor: pointer;">
          <span style="display: block; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Update Resume</span>
          <span style="display: block; margin-top: 2px; font-size: 10.5px; color: #A32B21;">JOBS · <span style="font-family: 'IBM Plex Mono', monospace;">1h 00m</span> · 2 days late</span>
        </label>
      </div>

      <div style="padding: 14px 0 8px 0; display: flex; flex-direction: column; gap: 7px;">
        <div style="display: flex; align-items: baseline; gap: 9px;">
          <span style="font-size: 12px; font-weight: 700;">Today</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #8A8478;">9 · 9h 50m</span>
          <span style="flex-grow: 1;"></span>
          <button type="button" style="border: 0; background: transparent; padding: 0; font-size: 11px; color: #A8431C; font-weight: 600; cursor: pointer;">Triage</button>
        </div>
        <div style="display: flex; align-items: center; gap: 9px;">
          <span style="width: 96px; height: 6px; border-radius: 3px; background: #EDE8DE; overflow: hidden; display: flex; flex-shrink: 0;">
            <span style="width: 53%; background: #94B394;"></span><span style="width: 47%; background: #E3C9C4;"></span>
          </span>
          <span style="font-size: 11px; color: #A32B21;">4h 35m over capacity</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; height: 56px; border-top: 1px solid #F0EBE1;">
        <input type="checkbox" id="n1" style="width: 15px; height: 15px; accent-color: #A8431C; margin: 0; flex-shrink: 0;">
        <span style="width: 7px; height: 7px; border-radius: 4px; background: #9A948A; flex-shrink: 0;"></span>
        <label for="n1" style="flex-grow: 1; min-width: 0; cursor: pointer;">
          <span style="display: block; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Claremont City Council Recording</span>
          <span style="display: block; margin-top: 2px; font-size: 10.5px; color: #6E6960;">INBOX · <span style="font-family: 'IBM Plex Mono', monospace;">2h 30m</span></span>
        </label>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; height: 56px; border-top: 1px solid #F0EBE1;">
        <input type="checkbox" id="n2" style="width: 15px; height: 15px; accent-color: #A8431C; margin: 0; flex-shrink: 0;">
        <span style="width: 7px; height: 7px; border-radius: 4px; background: #3B7048; flex-shrink: 0;"></span>
        <label for="n2" style="flex-grow: 1; min-width: 0; cursor: pointer;">
          <span style="display: block; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Clean up Repos</span>
          <span style="display: block; margin-top: 2px; font-size: 10.5px; color: #6E6960;">RESEARCH · <span style="font-family: 'IBM Plex Mono', monospace;">2h 00m</span></span>
        </label>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; height: 56px; border-top: 1px solid #F0EBE1;">
        <input type="checkbox" id="n3" style="width: 15px; height: 15px; accent-color: #A8431C; margin: 0; flex-shrink: 0;">
        <span style="width: 7px; height: 7px; border-radius: 4px; background: #2E5FA3; flex-shrink: 0;"></span>
        <label for="n3" style="flex-grow: 1; min-width: 0; cursor: pointer;">
          <span style="display: block; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Clinic SOW</span>
          <span style="display: block; margin-top: 2px; font-size: 10.5px; color: #1F4A80;">CLINIC · <span style="font-family: 'IBM Plex Mono', monospace;">1h 00m</span> · scheduled 5:45pm</span>
        </label>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; height: 56px; border-top: 1px solid #F0EBE1;">
        <input type="checkbox" id="n4" style="width: 15px; height: 15px; accent-color: #A8431C; margin: 0; flex-shrink: 0;">
        <span style="width: 7px; height: 7px; border-radius: 4px; background: #3B7048; flex-shrink: 0;"></span>
        <label for="n4" style="flex-grow: 1; min-width: 0; cursor: pointer;">
          <span style="display: block; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Explore Vienna 4x22 Dataset</span>
          <span style="display: block; margin-top: 2px; font-size: 10.5px; color: #6E6960;">RESEARCH · <span style="font-family: 'IBM Plex Mono', monospace;">1h 00m</span></span>
        </label>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; height: 56px; border-top: 1px solid #F0EBE1;">
        <input type="checkbox" id="n5" style="width: 15px; height: 15px; accent-color: #A8431C; margin: 0; flex-shrink: 0;">
        <span style="width: 7px; height: 7px; border-radius: 4px; background: #3B7048; flex-shrink: 0;"></span>
        <label for="n5" style="flex-grow: 1; min-width: 0; cursor: pointer;">
          <span style="display: block; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Read Paper Draft and Provide Feedback</span>
          <span style="display: block; margin-top: 2px; font-size: 10.5px; color: #6E6960;">RESEARCH · <span style="font-family: 'IBM Plex Mono', monospace;">45m</span></span>
        </label>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; height: 56px; border-top: 1px solid #F0EBE1;">
        <input type="checkbox" id="n6" style="width: 15px; height: 15px; accent-color: #A8431C; margin: 0; flex-shrink: 0;">
        <span style="width: 7px; height: 7px; border-radius: 4px; background: #4C4AA0; flex-shrink: 0;"></span>
        <label for="n6" style="flex-grow: 1; min-width: 0; cursor: pointer;">
          <span style="display: block; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Review OS Processes</span>
          <span style="display: block; margin-top: 2px; font-size: 10.5px; color: #6E6960;">CS134 · <span style="font-family: 'IBM Plex Mono', monospace;">45m</span></span>
        </label>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; height: 56px; border-top: 1px solid #F0EBE1;">
        <input type="checkbox" id="n7" style="width: 15px; height: 15px; accent-color: #A8431C; margin: 0; flex-shrink: 0;">
        <span style="width: 7px; height: 7px; border-radius: 4px; background: #A63A66; flex-shrink: 0;"></span>
        <label for="n7" style="flex-grow: 1; min-width: 0; cursor: pointer;">
          <span style="display: block; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Wash Sheets</span>
          <span style="display: block; margin-top: 2px; font-size: 10.5px; color: #6E6960;">PERSONAL · <span style="font-family: 'IBM Plex Mono', monospace;">20m</span> · 3 steps</span>
        </label>
      </div>

    </div>
  </div>

  <!-- TAB BAR -->
  <div style="flex-shrink: 0; height: 62px; box-sizing: border-box; border-top: 1px solid #E4DFD5; background: #F5F2EC; display: flex; align-items: center; margin-top: 12px;">
    <a href="narrow-today.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #6E6960;">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12.5" rx="2"></rect><path d="M3 8.5 L17 8.5 M7 3 L7 6 M13 3 L13 6"></path></svg>
      <span style="font-size: 9.5px;">Today</span>
    </a>
    <a href="narrow-tasks.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #A8431C;">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 10.5 L8 14.5 L16 5.5"></path></svg>
      <span style="font-size: 9.5px; font-weight: 600;">Tasks</span>
    </a>
    <a href="#habits" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #6E6960;">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="10" r="6.5"></circle><circle cx="10" cy="10" r="2"></circle></svg>
      <span style="font-size: 9.5px;">Habits</span>
    </a>
    <a href="narrow-projects.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #6E6960;">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3.5" y="3.5" width="5.5" height="5.5" rx="1"></rect><rect x="11" y="3.5" width="5.5" height="5.5" rx="1"></rect><rect x="3.5" y="11" width="5.5" height="5.5" rx="1"></rect><rect x="11" y="11" width="5.5" height="5.5" rx="1"></rect></svg>
      <span style="font-size: 9.5px;">Projects</span>
    </a>
    <a href="#insights" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #6E6960;">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 16 L4 11 M8.5 16 L8.5 6 M13 16 L13 9 M17 16 L17 4"></path></svg>
      <span style="font-size: 9.5px;">Insights</span>
    </a>
  </div>

</div>
</body>
</html>
