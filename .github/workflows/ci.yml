name: CI

# Pull requests and pushes to main. The three checks below are the ones
# CLAUDE.md asks for before committing; running them here is what makes that
# a rule rather than a habit.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The migration check below asks what this branch added
          # *since it diverged* from the target, which needs a merge base — and
          # a shallow clone has none. At the default depth of 1 that comparison
          # died with "no merge base", the error was swallowed, and the step
          # cheerfully reported "No new migrations" on every PR ever opened,
          # including ones that added them. A check that cannot fail is not a
          # check.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # The timezone tests depend on full ICU data, which the official
          # Node images carry. 22 is the LTS closest to the local runtime.
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what the
      # lockfile says, so a green run here means the same tree everyone else has.
      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint

      - name: Tests
        run: npm test

      # The app is deployed now, and a build that only ever runs on Vercel is a
      # build whose failures arrive as a broken deployment. It had genuinely
      # never been run anywhere until 2026-09-22; it passed, and this is what
      # keeps that true. Its own dist dir so a local run cannot collide with a
      # dev server — see the comment in next.config.ts.
      # Deliberately with no environment at all. Vercel Preview builds have
      # none either — the variables are Production-scoped — and that is exactly
      # how /settings being prerendered got through: it called
      # createServiceClient() at build time, which needs a URL. Giving CI
      # placeholder values would let it construct one and go green while the
      # real build went red, which is worse than not building at all.
      - name: Build
        run: npx next build
        env:
          NEXT_DIST_DIR: .next-ci

      # Migrations are applied by hand against Supabase, and one has been
      # forgotten before — 0013 sat unapplied for days while the feature that
      # needed it silently did nothing. CI cannot see the database, but it can
      # make a new migration impossible to merge without noticing.
      - name: Flag new migrations
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.base_ref }}"
          # No --depth here either: re-fetching shallow would undo fetch-depth: 0.
          git fetch --no-tags origin "${{ github.base_ref }}"

          # Prove the comparison can run before trusting what it says. Without
          # this the happy path and the broken path print the same reassuring
          # line, which is how "No new migrations" went unquestioned through
          # every PR. merge-base exits non-zero when there is none, and the
          # step runs under `bash -e`, so a broken check now fails loudly
          # instead of passing quietly.
          MERGE_BASE=$(git merge-base "$BASE" HEAD)
          echo "Comparing against $BASE (merge base ${MERGE_BASE:0:12})"

          # Three dots — files added since this branch diverged, not files that
          # merely differ from the tip of the target. No `|| true`: a diff that
          # cannot run is a broken check, and swallowing its error is exactly
          # how this one stayed broken while looking green.
          NEW=$(git diff --name-only --diff-filter=A "$BASE...HEAD" -- supabase/migrations/)
          if [ -n "$NEW" ]; then
            echo "::warning title=Migration needs applying::This PR adds migrations. Apply them to Supabase before merging:"
            echo "$NEW" | while read -r f; do echo "::warning::  $f"; done
          else
            echo "No new migrations."
          fi
